---
layout: default
---

{% include menu.html %}

<main class="home" id="main" role="main" aria-label="Content">

<h1>Posts tagged {{ page.tag }}</h1>

{% assign tag_name = page.tag %}

<ul class="post-list">
{% for post in site.posts %}
  {% if post.tags contains page.tag %}
    {% include post-list-item.html %}
  {% endif %}
{% endfor %}
</ul>

</main>
